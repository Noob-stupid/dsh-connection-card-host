<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 340" width="680" height="340" font-family="ui-sans-serif, system-ui, 'Segoe UI', sans-serif">
  <title>卡片工具：会话通过一个桥接调卡片里的真工具链</title>
  <desc>卡片挂在连接上，注册工具；会话用一个常驻桥接工具按需发现并调用，且受可见范围约束</desc>
  <defs>
    <style><![CDATA[
      .bg{fill:#0d1117}
      .box{fill:#161b22;stroke:#30363d}
      .card{fill:#161b22;stroke:#3b82f6;stroke-opacity:.55}
      .txt{fill:#c9d1d9;font-size:12px}
      .hint{fill:#8b949e;font-size:10.5px}
      .lab{fill:#e6edf3;font-size:12px;font-weight:600}
      .mono{font-family:ui-monospace,Menlo,Consolas,monospace;fill:#79c0ff;font-size:11px}

      /* 调用链：三段依次点亮 */
      .s1{animation:s1 3.6s ease-in-out infinite}
      .s2{animation:s2 3.6s ease-in-out infinite}
      .s3{animation:s3 3.6s ease-in-out infinite}
      @keyframes s1{0%{stroke-opacity:0}8%,80%{stroke-opacity:1}92%,100%{stroke-opacity:0}}
      @keyframes s2{0%,18%{stroke-opacity:0}26%,80%{stroke-opacity:1}92%,100%{stroke-opacity:0}}
      @keyframes s3{0%,40%{stroke-opacity:0}48%,80%{stroke-opacity:1}92%,100%{stroke-opacity:0}}

      /* 沿线的流动小点 */
      .dot1{animation:d1 3.6s ease-in-out infinite}
      .dot2{animation:d2 3.6s ease-in-out infinite}
      @keyframes d1{0%{transform:translate(0,0);opacity:0}8%{opacity:1}22%{transform:translate(150px,0);opacity:0}100%{opacity:0}}
      @keyframes d2{0%,30%{transform:translate(0,0);opacity:0}38%{opacity:1}56%{transform:translate(158px,0);opacity:0}100%{opacity:0}}

      /* 卡片注册的工具"亮一下" */
      .tool{animation:tool 3.6s ease-in-out infinite}
      @keyframes tool{0%,56%{fill:#484f58}66%,84%{fill:#3b82f6}94%,100%{fill:#484f58}}

      /* 被挡住的那张卡（范围不符） */
      .blocked{animation:blocked 3.6s ease-in-out infinite}
      @keyframes blocked{0%,60%{opacity:.35}72%,86%{opacity:.9}96%,100%{opacity:.35}}
      .deny{animation:deny 3.6s ease-in-out infinite}
      @keyframes deny{0%,62%{opacity:0}74%,86%{opacity:1}96%,100%{opacity:0}}
    ]]></style>
  </defs>

  <rect class="bg" width="680" height="340" rx="10"/>

  <text class="lab" x="24" y="28">会话 A</text>
  <rect class="box" x="24" y="38" width="150" height="70" rx="8"/>
  <text class="txt" x="36" y="60">只看得见</text>
  <text class="mono" x="36" y="78">connection_card_tool</text>
  <text class="hint" x="36" y="96">（1 个常驻桥接，不是 N 个工具）</text>

  <text class="lab" x="506" y="28">连接上挂的卡片</text>
  <rect class="card" x="506" y="38" width="150" height="52" rx="8"/>
  <text class="txt" x="518" y="58">pdf-card</text>
  <text class="hint" x="518" y="74">pdf_read / pdf_info</text>
  <circle class="tool" cx="518" cy="82" r="3" fill="#484f58"/>
  <rect class="card" x="506" y="100" width="150" height="52" rx="8"/>
  <text class="txt" x="518" y="120">file-watch-card</text>
  <text class="hint" x="518" y="136">file_changed_since / list_dir</text>
  <circle class="tool" cx="518" cy="144" r="3" fill="#484f58"/>
  <rect class="card blocked" x="506" y="162" width="150" height="42" rx="8"/>
  <text class="txt" x="518" y="182">某卡片（仅 B 端）</text>
  <text class="deny hint" x="518" y="197" fill="#f85149">A 端调不到 → 明确拒绝</text>

  <!-- 调用链 -->
  <path class="s1" d="M 176 73 L 320 73" stroke="#3b82f6" stroke-width="1.6" fill="none"/>
  <path class="s2" d="M 320 73 L 320 64 L 504 64" stroke="#3b82f6" stroke-width="1.6" fill="none"/>
  <circle class="dot1" cx="176" cy="73" r="3.5" fill="#79c0ff"/>
  <circle class="dot2" cx="320" cy="64" r="3.5" fill="#79c0ff"/>

  <text class="hint" x="196" y="66">1. 列出可用卡片</text>
  <text class="hint" x="330" y="56">2. 按 instanceId 调 pdf_read</text>

  <!-- 真依赖 -->
  <rect class="box" x="24" y="150" width="290" height="86" rx="8"/>
  <text class="lab" x="36" y="172">卡片里可以塞真依赖</text>
  <text class="hint" x="36" y="192">pdfjs-dist 33 MB 随卡片装在本地</text>
  <text class="hint" x="36" y="210">不碰 DSH profile，DSH 升级也不受影响</text>
  <text class="hint" x="36" y="228">（卡片协议禁止 import @deepseek-ai/*）</text>

  <!-- 结果 -->
  <rect class="box" x="24" y="256" width="632" height="62" rx="8"/>
  <text class="hint" x="36" y="276">会话拿到的结果：</text>
  <text class="mono" x="36" y="296">PDF Card Cross-Session Test / Line 2: hello from the card toolchain …</text>
  <text class="hint" x="36" y="312">33 MB 的工具链、一次调用、一个常驻 schema —— 长尾按需，核心常驻</text>
</svg>
